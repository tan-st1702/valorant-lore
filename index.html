<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT — Лор Агентов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff4655;
            --dark: #0f1923;
            --light: #ece8e1;
            --teal: #00c8c8;
            --yellow: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Анимированный фон */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 70, 85, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 200, 200, 0.05) 0%, transparent 50%),
                var(--dark);
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 70, 85, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 70, 85, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Шапка */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 70, 85, 0.2);
            background: rgba(15, 25, 35, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Russo One', sans-serif;
            font-size: 28px;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .logo span {
            color: var(--light);
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: var(--light);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            transition: color 0.3s;
            position: relative;
        }

        nav a:hover {
            color: var(--red);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--red);
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Главный экран */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            position: relative;
        }

        .hero h1 {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(40px, 8vw, 80px);
            text-transform: uppercase;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--light) 0%, var(--red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 10px rgba(255, 70, 85, 0.3)); }
            100% { filter: drop-shadow(0 0 30px rgba(255, 70, 85, 0.6)); }
        }

        .hero p {
            font-size: 20px;
            max-width: 600px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .cta-button {
            padding: 15px 40px;
            background: var(--red);
            color: var(--light);
            border: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .cta-button:hover {
            background: #ff5a6e;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 70, 85, 0.4);
        }

        /* Секция агентов */
        .agents-section {
            padding: 60px 40px;
        }

        .section-title {
            font-family: 'Russo One', sans-serif;
            font-size: 36px;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 3px;
            background: var(--red);
            margin: 15px auto 0;
        }

        /* Фильтры */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 25px;
            background: transparent;
            border: 1px solid rgba(255, 70, 85, 0.3);
            color: var(--light);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
        }

        /* Сетка агентов */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Карточка агента */
        .agent-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 70, 85, 0.15);
            padding: 25px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--red);
            transform: scaleX(0);
            transition: transform 0.4s;
        }

        .agent-card:hover {
            transform: translateY(-10px);
            border-color: var(--red);
            background: rgba(255, 70, 85, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .agent-card:hover::before {
            transform: scaleX(1);
        }

        .agent-role {
            display: inline-block;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            background: rgba(255, 70, 85, 0.15);
            color: var(--red);
        }

        .agent-name {
            font-family: 'Russo One', sans-serif;
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .agent-real-name {
            font-size: 14px;
            opacity: 0.6;
            margin-bottom: 15px;
        }

        .agent-origin {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .agent-origin::before {
            content: '📍';
        }

        .agent-description {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.8;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--dark);
            border: 1px solid var(--red);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s;
            clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--light);
            font-size: 30px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-header {
            padding: 40px;
            background: linear-gradient(135deg, rgba(255, 70, 85, 0.1) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255, 70, 85, 0.2);
        }

        .modal-role {
            display: inline-block;
            padding: 5px 15px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--red);
            margin-bottom: 15px;
        }

        .modal-name {
            font-family: 'Russo One', sans-serif;
            font-size: 42px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .modal-real-name {
            font-size: 18px;
            opacity: 0.6;
        }

        .modal-body {
            padding: 40px;
        }

        .lore-section {
            margin-bottom: 30px;
        }

        .lore-section h3 {
            font-family: 'Russo One', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lore-section h3::before {
            content: '';
            width: 20px;
            height: 2px;
            background: var(--red);
        }

        .lore-section p {
            line-height: 1.8;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .abilities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .ability {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 70, 85, 0.15);
            padding: 15px;
            transition: all 0.3s;
        }

        .ability:hover {
            border-color: var(--red);
            background: rgba(255, 70, 85, 0.05);
        }

        .ability-key {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            background: var(--red);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .ability-name {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .ability-desc {
            font-size: 12px;
            opacity: 0.7;
            line-height: 1.5;
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--red);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            nav {
                gap: 15px;
            }

            .hero {
                min-height: 60vh;
            }

            .agents-section {
                padding: 40px 20px;
            }

            .modal-header,
            .modal-body {
                padding: 25px;
            }

            .modal-name {
                font-size: 28px;
            }
        }

        /* Анимации появления */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Граф взаимоотношений */
        .graph-section {
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.02);
        }

        .graph-container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .graph-svg {
            width: 100%;
            height: 600px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 70, 85, 0.2);
            border-radius: 10px;
        }

        .graph-node {
            cursor: pointer;
            transition: all 0.3s;
        }

        .graph-node:hover {
            filter: brightness(1.3);
        }

        .graph-node-circle {
            fill: var(--dark);
            stroke: var(--red);
            stroke-width: 2;
        }

        .graph-node-text {
            fill: var(--light);
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            font-family: 'Rajdhani', sans-serif;
        }

        .graph-node image {
            clip-path: circle(30px);
            transition: all 0.3s;
        }

        .graph-node:hover image {
            filter: brightness(1.2);
        }

        .graph-edge {
            fill: none;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s;
        }

        .graph-edge:hover {
            stroke-width: 4;
            filter: brightness(1.5);
        }

        .graph-edge.love { stroke: #ff69b4; }
        .graph-edge.hate { stroke: #8b0000; }
        .graph-edge.friendship { stroke: #00ff7f; }
        .graph-edge.rivalry { stroke: #ff8c00; }
        .graph-edge.family { stroke: #4169e1; }
        .graph-edge.respect { stroke: #00bfff; }

        .graph-tooltip {
            position: absolute;
            background: rgba(15, 25, 35, 0.95);
            border: 1px solid var(--red);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .graph-tooltip.visible {
            opacity: 1;
        }

        .graph-tooltip h4 {
            color: var(--red);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .graph-tooltip p {
            font-size: 13px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .graph-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-color.love { background: #ff69b4; }
        .legend-color.hate { background: #8b0000; }
        .legend-color.friendship { background: #00ff7f; }
        .legend-color.rivalry { background: #ff8c00; }
        .legend-color.family { background: #4169e1; }
        .legend-color.respect { background: #00bfff; }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <header>
        <div class="logo">VALO<span>RANT</span></div>
        <nav>
            <a href="#hero">Главная</a>
            <a href="#agents">Агенты</a>
            <a href="#graph">Граф взаимоотношений</a>
        </nav>
    </header>

    <section class="hero" id="hero">
        <h1>Лор Агентов</h1>
        <p>Узнай истории героев, сражающихся на передовой войны между мирами. Каждый агент — это уникальная личность со своим прошлым, мотивацией и тайнами.</p>
        <button class="cta-button" onclick="scrollToAgents()">Исследовать агентов</button>
    </section>

    <section class="agents-section" id="agents">
        <h2 class="section-title">Выбери агента</h2>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="duelist">Дуэлянты</button>
            <button class="filter-btn" data-filter="initiator">Инициаторы</button>
            <button class="filter-btn" data-filter="controller">Контролёры</button>
            <button class="filter-btn" data-filter="sentinel">Стражи</button>
        </div>

        <div class="agents-grid" id="agentsGrid">
            <!-- Карточки агентов будут добавлены через JavaScript -->
        </div>
    </section>

    <section class="graph-section" id="graph">
        <h2 class="section-title">Граф взаимоотношений</h2>
        
        <div class="graph-container">
            <svg class="graph-svg" id="graphSvg"></svg>
            <div class="graph-tooltip" id="graphTooltip"></div>
            
            <div class="graph-legend">
                <div class="legend-item">
                    <div class="legend-color love"></div>
                    <span>Любовная связь</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color hate"></div>
                    <span>Неприязнь</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color friendship"></div>
                    <span>Дружба</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color rivalry"></div>
                    <span>Соперничество</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color respect"></div>
                    <span>Уважение</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <span class="modal-role" id="modalRole"></span>
                <h2 class="modal-name" id="modalName"></h2>
                <p class="modal-real-name" id="modalRealName"></p>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Контент добавляется через JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // URL портретов агентов
        const agentPortraits = {
            "Jett": "https://static.wikia.nocookie.net/valorant/images/7/7e/Jett_artwork.png",
            "Phoenix": "https://static.wikia.nocookie.net/valorant/images/1/1e/Phoenix_artwork.png",
            "Sage": "https://static.wikia.nocookie.net/valorant/images/8/8e/Sage_artwork.png",
            "Reyna": "https://static.wikia.nocookie.net/valorant/images/5/5e/Reyna_artwork.png",
            "Omen": "https://static.wikia.nocookie.net/valorant/images/4/4e/Omen_artwork.png",
            "Cypher": "https://static.wikia.nocookie.net/valorant/images/3/3e/Cypher_artwork.png",
            "Breach": "https://static.wikia.nocookie.net/valorant/images/2/2e/Breach_artwork.png",
            "Sova": "https://static.wikia.nocookie.net/valorant/images/9/9e/Sova_artwork.png",
            "Viper": "https://static.wikia.nocookie.net/valorant/images/6/6e/Viper_artwork.png",
            "Killjoy": "https://static.wikia.nocookie.net/valorant/images/0/0e/Killjoy_artwork.png",
            "Skye": "https://static.wikia.nocookie.net/valorant/images/a/ae/Skye_artwork.png",
            "Yoru": "https://static.wikia.nocookie.net/valorant/images/b/be/Yoru_artwork.png",
            "Astra": "https://static.wikia.nocookie.net/valorant/images/c/ce/Astra_artwork.png",
            "KAY/O": "https://static.wikia.nocookie.net/valorant/images/d/de/KAYO_artwork.png",
            "Fade": "https://static.wikia.nocookie.net/valorant/images/e/ee/Fade_artwork.png",
            "Harbor": "https://static.wikia.nocookie.net/valorant/images/f/fe/Harbor_artwork.png",
            "Gekko": "https://static.wikia.nocookie.net/valorant/images/1/1e/Gekko_artwork.png",
            "Deadlock": "https://static.wikia.nocookie.net/valorant/images/2/2e/Deadlock_artwork.png",
            "Iso": "https://static.wikia.nocookie.net/valorant/images/3/3e/Iso_artwork.png",
            "Clove": "https://static.wikia.nocookie.net/valorant/images/4/4e/Clove_artwork.png",
            "Vyse": "https://static.wikia.nocookie.net/valorant/images/5/5e/Vyse_artwork.png",
            "Tejo": "https://static.wikia.nocookie.net/valorant/images/6/6e/Tejo_artwork.png",
            "Waylay": "https://static.wikia.nocookie.net/valorant/images/7/7e/Waylay_artwork.png",
            "Chamber": "https://static.wikia.nocookie.net/valorant/images/8/8e/Chamber_artwork.png",
            "Raze": "https://static.wikia.nocookie.net/valorant/images/9/9e/Raze_artwork.png"
        };

        // Данные о взаимоотношениях

        // Рендер карточек агентов
        function renderAgents(filter = 'all') {
            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = '';

            const filteredAgents = filter === 'all' 
                ? agents 
                : agents.filter(agent => agent.role === filter);

            filteredAgents.forEach((agent, index) => {
                const card = document.createElement('div');
                card.className = `agent-card fade-in stagger-${(index % 5) + 1}`;
                card.innerHTML = `
                    <span class="agent-role">${agent.roleName}</span>
                    <h3 class="agent-name">${agent.name}</h3>
                    <p class="agent-real-name">${agent.realName}</p>
                    <div class="agent-origin">${agent.origin}</div>
                    <p class="agent-description">${agent.description}</p>
                `;
                card.onclick = () => openModal(agent);
                grid.appendChild(card);
            });
        }

        // Открытие модального окна
        function openModal(agent) {
            document.getElementById('modalRole').textContent = agent.roleName;
            document.getElementById('modalName').textContent = agent.name;
            document.getElementById('modalRealName').textContent = agent.realName;

            const body = document.getElementById('modalBody');
            body.innerHTML = `
                <div class="lore-section">
                    <h3>Предыстория</h3>
                    <p>${agent.lore.background}</p>
                </div>
                <div class="lore-section">
                    <h3>Характер</h3>
                    <p>${agent.lore.personality}</p>
                </div>
                <div class="lore-section">
                    <h3>Отношения</h3>
                    <p>${agent.lore.relationships}</p>
                </div>
                <div class="lore-section">
                    <h3>Способности</h3>
                    <div class="abilities-grid">
                        ${agent.abilities.map(ability => `
                            <div class="ability">
                                <span class="ability-key">${ability.key}</span>
                                <div class="ability-name">${ability.name}</div>
                                <div class="ability-desc">${ability.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Закрытие модального окна
        function closeModal(event) {
            if (!event || event.target === document.getElementById('modalOverlay') || event.target.classList.contains('modal-close')) {
                document.getElementById('modalOverlay').classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        // Прокрутка к агентам
        function scrollToAgents() {
            document.getElementById('agents').scrollIntoView({ behavior: 'smooth' });
        }

        // Фильтрация
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderAgents(btn.dataset.filter);
            });
        });

        // Закрытие по Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Цвета для агентов
        function getAgentColor(name) {
            const colors = {
                "Jett": "#00c8c8", "Phoenix": "#ff6b35", "Sage": "#00ff88", "Reyna": "#ff0055",
                "Omen": "#8b00ff", "Cypher": "#ffd700", "Breach": "#ff4500", "Sova": "#00bfff",
                "Viper": "#32cd32", "Killjoy": "#ff69b4", "Skye": "#87ceeb", "Yoru": "#4b0082",
                "Astra": "#daa520", "KAY/O": "#c0c0c0", "Fade": "#483d8b", "Harbor": "#20b2aa",
                "Gekko": "#9acd32", "Deadlock": "#708090", "Iso": "#da70d6", "Clove": "#ff1493",
                "Vyse": "#3cb371", "Tejo": "#ff8c00", "Waylay": "#00ced1", "Chamber": "#b8860b",
                "Raze": "#ff4500"
            };
            return colors[name] || "#ff4655";
        }

        // Отрисовка графа взаимоотношений
        function renderGraph() {
            const svg = document.getElementById('graphSvg');
            const tooltip = document.getElementById('graphTooltip');
            const width = svg.clientWidth || 1200;
            const height = 600;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 80;

            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            svg.innerHTML = '';

            // Создаём узлы (только те агенты, у которых есть связи)
            const connectedAgents = new Set();
            relationships.forEach(rel => {
                connectedAgents.add(rel.source);
                connectedAgents.add(rel.target);
            });

            const agentsInGraph = agents.filter(a => connectedAgents.has(a.name));
            const angleStep = (2 * Math.PI) / agentsInGraph.length;

            const nodePositions = {};
            agentsInGraph.forEach((agent, i) => {
                const angle = i * angleStep - Math.PI / 2;
                nodePositions[agent.name] = {
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                };
            });

            // Рисуем рёбра (связи)
            relationships.forEach(rel => {
                const source = nodePositions[rel.source];
                const target = nodePositions[rel.target];
                if (!source || !target) return;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', source.x);
                line.setAttribute('y1', source.y);
                line.setAttribute('x2', target.x);
                line.setAttribute('y2', target.y);
                line.setAttribute('class', `graph-edge ${rel.type}`);
                line.setAttribute('data-source', rel.source);
                line.setAttribute('data-target', rel.target);
                line.setAttribute('data-type', rel.type);
                line.setAttribute('data-description', rel.description);

                line.addEventListener('mouseenter', (e) => {
                    tooltip.innerHTML = `
                        <h4>${rel.source} ↔ ${rel.target}</h4>
                        <p>${rel.description}</p>
                    `;
                    tooltip.classList.add('visible');
                });

                line.addEventListener('mousemove', (e) => {
                    const rect = svg.getBoundingClientRect();
                    let x = e.clientX - rect.left + 15;
                    let y = e.clientY - rect.top + 15;
                    if (x + 300 > rect.width) x -= 320;
                    if (y + 150 > rect.height) y -= 170;
                    tooltip.style.left = x + 'px';
                    tooltip.style.top = y + 'px';
                });

                line.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('visible');
                });

                svg.appendChild(line);
            });

            // Рисуем узлы (агенты)
            agentsInGraph.forEach(agent => {
                const pos = nodePositions[agent.name];
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'graph-node');

                // Кружок с портретом
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', 35);
                circle.setAttribute('class', 'graph-node-circle');

                // Портрет агента через прокси
                const portraitUrl = agentPortraits[agent.name];
                if (portraitUrl) {
                    const proxyUrl = `https://images.weserv.nl/?url=${encodeURIComponent(portraitUrl.replace('https://', ''))}&w=60&h=60&fit=cover`;
                    const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');
                    image.setAttribute('href', proxyUrl);
                    image.setAttribute('x', pos.x - 30);
                    image.setAttribute('y', pos.y - 30);
                    image.setAttribute('width', 60);
                    image.setAttribute('height', 60);
                    image.setAttribute('clip-path', 'circle(30px)');
                    group.appendChild(image);
                } else {
                    // Фallback: кружок с инициалами
                    const innerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    innerCircle.setAttribute('cx', pos.x);
                    innerCircle.setAttribute('cy', pos.y);
                    innerCircle.setAttribute('r', 30);
                    innerCircle.setAttribute('fill', getAgentColor(agent.name));
                    innerCircle.setAttribute('opacity', '0.3');

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', pos.x);
                    text.setAttribute('y', pos.y);
                    text.setAttribute('class', 'graph-node-text');
                    text.setAttribute('font-size', '16');
                    text.textContent = agent.name.substring(0, 2).toUpperCase();

                    group.appendChild(innerCircle);
                    group.appendChild(text);
                }

                group.appendChild(circle);

                group.addEventListener('click', () => openModal(agent));

                svg.appendChild(group);
            });
        }

        // Инициализация
        renderAgents();
        renderGraph();
    </script>
